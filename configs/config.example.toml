# Example Application Configuration
# NOTE: Config files are OPTIONAL! This application follows Twelve-Factor App methodology.
# You can run the application with ONLY environment variables:
#   export APP_SERVER_PORT=8080
#   export APP_DATABASE_HOST=localhost
#   export APP_DATABASE_PASSWORD=secret
#   ./app api
#
# Config files are provided for LOCAL DEVELOPMENT convenience only.
# In production, use environment variables.
#
# Environment variables override config values using APP_ prefix:
#   APP_DATABASE_PASSWORD=secret
#   APP_LOGGER_LEVEL=debug

[server]
port = 8080
host = "0.0.0.0"
mode = "debug"  # debug, release, test

[database]
driver = "postgres"  # postgres, mysql, sqlite
host = "localhost"
port = 5432
user = "postgres"
password = "postgres"
dbname = "go_clean_arch"
sslmode = "disable"
# Auto-migrate disabled by default for production safety (Factor XII - Admin Processes)
# Use explicit migration commands instead: ./app migrate up
auto_migrate = false

[rabbitmq]
url = "amqp://guest:guest@localhost:5672/"
queue_name = "order_queue"

[cron]
daily_report_schedule = "0 0 * * *"  # Every day at midnight (cron syntax)

[stripe]
api_key = "your-stripe-api-key"
secret_key = "your-stripe-secret-key"

[logger]
level = "info"   # debug, info, warn, error
format = "json"  # json (recommended for production), text (better for development)
