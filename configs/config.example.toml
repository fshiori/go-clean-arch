# Example Application Configuration
# Copy this file to config.toml and modify as needed
# You can override any value with environment variables using APP_ prefix
# Example: APP_DATABASE_PASSWORD=secret APP_LOGGER_LEVEL=debug

[server]
port = 8080
host = "0.0.0.0"
mode = "debug"  # debug, release, test

[database]
driver = "postgres"  # postgres, mysql, sqlite
host = "localhost"
port = 5432
user = "postgres"
password = "postgres"
dbname = "go_clean_arch"
sslmode = "disable"
auto_migrate = true

[rabbitmq]
url = "amqp://guest:guest@localhost:5672/"
queue_name = "order_queue"

[cron]
daily_report_schedule = "0 0 * * *"  # Every day at midnight (cron syntax)

[stripe]
api_key = "your-stripe-api-key"
secret_key = "your-stripe-secret-key"

[logger]
level = "info"   # debug, info, warn, error
format = "json"  # json (recommended for production), text (better for development)
