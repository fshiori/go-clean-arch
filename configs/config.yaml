# Application Configuration
# NOTE: Config files are OPTIONAL! This application follows Twelve-Factor App methodology.
# In production, use environment variables instead of config files.
#
# Environment variables override values using APP_ prefix:
#   APP_DATABASE_PASSWORD=secret
#   APP_LOGGER_LEVEL=debug

server:
  port: 8080
  host: "0.0.0.0"
  mode: "debug"  # debug, release, test

database:
  driver: "mysql"  # Currently only mysql is supported
  host: "localhost"
  port: 3306
  user: "root"
  password: "password"
  dbname: "go_clean_arch"
  sslmode: "disable"
  # Auto-migrate disabled - use explicit migrations: ./app migrate up
  auto_migrate: false

rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  queue_name: "order_queue"

cron:
  daily_report_schedule: "0 0 * * *"  # Every day at midnight

stripe:
  api_key: "your-stripe-api-key"
  secret_key: "your-stripe-secret-key"
